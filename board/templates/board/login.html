<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход на сайт</title>
    <style>
        /* Базовые стили для центрирования формы входа */
        body { font-family: sans-serif; max-width: 400px; margin: 60px auto; padding: 20px; color: #333; background-color: #f9fafb; }
        .form-box { background: #ffffff; padding: 24px; border-radius: 8px; border: 1px solid #e5e7eb; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-top: 0; color: #111827; }
        form p { margin-bottom: 15px; }
        /* Стилизуем инпуты ввода логина и пароля */
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; margin-top: 5px; }
        button { background: #007bff; color: white; padding: 12px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1em; transition: background 0.2s; }
        button:hover { background: #0056b3; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #6b7280; text-decoration: none; font-size: 0.9em; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="form-box">
        <h2>🔐 Вход в личный кабинет</h2>
        
        <!-- Форма отправляет POST-запрос на этот же адрес для проверки авторизации -->
        <form method="post" novalidate>
            {% csrf_token %}
            <!-- Встроенный тег Django выведет поля Username и Password автоматически -->
            {{ form.as_p }}
            <button type="submit">Войти</button>
        </form>
        
        <a href="{% url 'board:index' %}" class="back-link">← Назад на главную</a>
    </div>

</body>
</html>
