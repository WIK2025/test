{% extends 'post/base.html'%}
{% block title %} {{ page_title }} {% endblock %}
{% block content %}
    <h1>Вход</h1>
    <form method="post">
        <!-- всешда в форме подключаем токен -->
        {% csrf_token %}
        <div>
            <label>Имя пользователя</label>
            {{ form.username }}
        </div>
         <div>
            <label>Пароль</label>
            {{ form.password }}
        </div>
        <button type="submit">Войти</button>
    </form>
{% endblock %}
