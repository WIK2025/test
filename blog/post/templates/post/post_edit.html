{% extends 'post/base.html' %}
{% block title %} Редактирование поста {% endblock %}

{% block content %}
    <div style="max-width: 600px; margin: 20px auto; padding: 25px; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px;">
        <h2 style="margin-top: 0; margin-bottom: 20px; color: #111827;">✏️ Редактировать пост: «{{ post.title }}»</h2>
        
        <form method="post" novalidate>
            {% csrf_token %}
            
            {% if form.errors %}
                <div style="color: #dc2626; margin-bottom: 15px; font-weight: 500; font-size: 0.9em;">
                    ❌ Пожалуйста, исправьте ошибки в полях формы ниже.
                </div>
            {% endif %}
            
            <div style="margin-bottom: 20px;">
                {{ form.as_p }}
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button type="submit" style="padding: 10px 20px; background: #f59e0b; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
                    Сохранить изменения
                </button>
                <a href="{% url 'post:post_detail' post.id %}" style="display: inline-block; padding: 10px 20px; background: #9ca3af; color: white; text-decoration: none; border-radius: 6px; font-weight: bold;">
                    Отмена
                </a>
            </div>
        </form>
    </div>
{% endblock %}
