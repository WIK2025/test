<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мой блог{% endblock %}</title>
</head>
<body>
    <header>
        <h1><a href="{% url 'post:post_list' %}">Мой блог</a></h1>
        <nav>
            <!-- проверка авторизации -->
            {% if user.is_authenticated %}
                <span>Привет, <strong>{{ user.username }}</strong>!</span>
                <a href="{% url 'post:create_post' %}" style="margin-left:10px;">Создать пост</a>
                <a href="{% url 'userProfile:profile' %}" style="margin-left:10px;">Мой Профиль</a>
                
                <form method="post" action="{% url 'logout' %}" style="display:inline; margin-left:10px;">
                    {% csrf_token %}
                    <button type="submit" style="background:none; border:none; color:blue; cursor:pointer; text-decoration:underline; padding:0;">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'userAcc:register' %}" style="margin-left:10px;">Регистрация</a>
            {% endif %}
        </nav>
    </header>
    
    <main style="padding: 20px 0;">
        {% if messages %}
         <div style="padding: 12px; margin-bottom: 20px; background-color: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px;">
            {% for message in messages %} 
                <div style="color: #166534; font-size: 0.95em; font-weight: 500;">✓ {{ message }}</div>
            {% endfor %}
         </div>
        {% endif %}
        
        {% block content %} {% endblock %}
    </main>
    
    <footer>
        <hr>
        <p>&copy; Мой блог </p>
    </footer>
</body>
</html>
