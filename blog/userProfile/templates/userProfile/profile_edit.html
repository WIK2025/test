{% extends 'post/base.html' %}
{% block title %} {{ page_title }} {% endblock %}

{% block content %}
<div style="margin-bottom: 20px;">
    <!-- ссылка для возврата в личный кабинет -->
    <a href="{% url 'userProfile:profile' %}" style="text-decoration: none; color: #3b82f6; font-weight: bold;">
        ← Назад в профиль
    </a>
</div>

<div style="max-width: 500px; margin: 0 auto; padding: 25px; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px;">
    <h1 style="margin-top: 0; margin-bottom: 25px; color: #111827;">✏️ Редактирование профиля</h1>
    
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div style="margin-bottom: 20px;">
            <h3 style="color: #4b5563; border-bottom: 1px solid #e5e7eb; padding-bottom: 5px; margin-bottom: 15px;">Данные аккаунта</h3>
            {{ u_form.as_p }}
        </div>
        
        <div style="margin-bottom: 25px;">
            <h3 style="color: #4b5563; border-bottom: 1px solid #e5e7eb; padding-bottom: 5px; margin-bottom: 15px;">Личные данные</h3>
            {{ p_form.as_p }}
        </div>
        
        <button type="submit" style="width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1em;">
            Сохранить изменения
        </button>
    </form>
</div>
{% endblock %}
