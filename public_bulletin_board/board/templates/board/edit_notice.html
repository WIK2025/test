<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Редактирование объявления</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; color: #333; line-height: 1.6; }
        .form-section { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 5px; margin-bottom: 15px; }
        button { background: #f59e0b; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #d97706; }
        .cancel-link { margin-left: 15px; color: #666; text-decoration: none; font-weight: bold; }
        .cancel-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h2>✏️ Редактирование объявления</h2>
    
    <div class="form-section">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Сохранить изменения</button>
            <a href="{% url 'board:notice_detail' notice.pk %}" class="cancel-link">Отмена</a>
        </form>
    </div>

</body>
</html>
