<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ notice.title }} — Объявление</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333; line-height: 1.6; }
        .notice-header { border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 20px; }
        .meta-info { font-size: 0.9em; color: #666; margin-top: 5px; }
        .content-body { background: #fff; padding: 10px 0; font-size: 1.1em; white-space: pre-wrap; }
        .back-link { display: inline-block; margin-top: 30px; color: #007bff; text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="notice-header">
        <h1>{{ notice.title }}</h1>
        <div class="meta-info">
            Автор: <strong>{{ notice.author_name }}</strong> | Дата публикации: {{ notice.created_at|date:"d.m.Y H:i" }}
        </div>
    </div>

    <!-- вывод  текста объявления -->
    <div class="content-body">
        {{ notice.content }}
    </div>
<!-- кнопка удаления объявления -->
<form method="post" action="{% url 'board:delete_notice' notice.pk %}" style="margin-top: 20px;">
    {% csrf_token %}
    <button type="submit" style="background: #ef4444; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Удалить объявление</button>
</form>

    <!-- ссылка назад к списку -->
    <a href="{% url 'board:index' %}" class="back-link">← Назад к списку</a>

</body>
</html>
